name: Diagnóstico Liga Pokémon (rodar 1x)

# Só manual: Actions > "Diagnóstico Liga Pokémon" > Run workflow.
# No fim, baixe o artefato "diagnostico-liga" (zip) e me mande.
on:
  workflow_dispatch:
    inputs:
      url_edicao:
        description: "URL de uma edição na Liga (opcional — copie da barra do navegador)"
        required: false
        default: ""
      url_carta:
        description: "URL de uma carta na Liga (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar diagnóstico
        env:
          URL_EDICAO: ${{ inputs.url_edicao }}
          URL_CARTA: ${{ inputs.url_carta }}
        run: python scraper/diagnostico_liga.py

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-liga
          path: diagnostico_liga/
          retention-days: 7
